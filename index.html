<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet"type="text/css"href="style.css">

        <title></title>

    </head>
    <body>
        <h1> MAYORS CALCULATOR</h1>
        <P class="warning">dont divide by zero</P>
        <div id="calculator" class="calculator">
            <button id="clear" class="ops" data-ops="clear">C</button>

            <div id="viewer">0   </div>

        <div id="row">
             <button class="num"data-num="7">7</button>
             <button class="num"data-num="8">8</button>
             <button class="num"data-num="9">9</button>
             <button data-ops="plus"class="ops">+</button>
        </div>

        <div id="row">
            <button class="num"data-num="4">4</button>
            <button class="num"data-num="5">5</button>
            <button class="num"data-num="6">6</button>
            <button data-ops="minus"class="ops">-</button>
       </div>

        <div id="row">
            <button class="num"data-num="1">1</button>
            <button class="num"data-num="2">2</button>
            <button class="num"data-num="3">3</button>
            <button data-ops="multiply"class="ops">*</button>
        </div>

        <div id="row">
            <button class="num"data-num="0">0</button>
            <button data-num="point"class="num">.</button>
            <button data-ops="equalto"class="ops">=</button>
            <button data-ops="divide"class="ops">/</button>

        </div>
<script src="script.js"></script>


</body>
</html>
